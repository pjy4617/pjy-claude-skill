# ===================================================================
# Orca 워크트리 훅 — 팀 공유 설정 ({{REPO_NAME}})
#
# 새 Orca 워크트리가 만들어진 직후(setup) / 아카이브되기 직전(archive)에
# 실행되는 스크립트다. 로컬 훅(Settings → General → 레포 → Worktree hooks)과
# 달리 이 파일은 커밋되어 팀 전체에 공유된다.
#
# 인식되는 최상위 키는 넷뿐이다: scripts · issueCommand · defaultTabs · environmentRecipes
#   ※ YAML 파싱 에러가 나면 Orca는 훅을 "부분 적용"하지 않고 통째로 무시한다.
#      수정 후에는 `scripts:` 하위 들여쓰기를 반드시 확인할 것.
#
# 실행 셸  : Linux/macOS = /bin/bash · Windows = %ComSpec%(cmd.exe)
#            → 아래 스크립트는 bash 전용이다. {{WINDOWS_NOTE}}
# 타임아웃 : 120초. 초과하면 중단되므로 무거운 빌드는 넣지 않는다.
# 작업경로 : $ORCA_WORKTREE_PATH 에서 단일 셸 스크립트로 한 번에 실행된다.
#
# 제공 환경변수
#   $ORCA_ROOT_PATH       메인 레포 체크아웃 경로 (공유 자산의 출처)
#   $ORCA_WORKTREE_PATH   지금 생성 중인 워크트리 경로
#   $ORCA_WORKSPACE_NAME  워크스페이스 이름 (보통 브랜치명)
#
# 소요시간 실측 ({{MEASURED_DATE}}, {{HOST_DESC}}): {{TIMING_NOTES}}
#
# 최초 실행 시 Orca가 "이 저장소의 orca.yaml 훅을 실행할까요?" 신뢰 확인을 띄운다.
# → "Always trust"를 선택하면 이후 워크트리부터 자동 실행된다.
# ===================================================================

scripts:
  setup: |
    # ★ Orca는 생성하는 setup-runner.sh 앞에 `set -e`를 주입한다. 그대로 두면
    #   첫 실패에서 스크립트가 통째로 죽어 이후 단계가 전부 누락된다.
    #   개별 단계는 실패해도 나머지를 진행해야 하므로 여기서 해제한다.
    set +e
    ROOT="${ORCA_ROOT_PATH:-}"
    WT="${ORCA_WORKTREE_PATH:-$PWD}"
    NAME="${ORCA_WORKSPACE_NAME:-$(basename "$WT")}"
    cd "$WT" || exit 0
    echo "▶ Orca setup — $NAME"

{{SETUP_STEPS}}

    echo "▶ setup 완료"

{{ARCHIVE_BLOCK}}
