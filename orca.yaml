# ===================================================================
# Orca 워크트리 훅 — 팀 공유 설정 (pjy-claude-skill)
#
# 새 Orca 워크트리가 만들어진 직후에 실행되는 스크립트다. 로컬 훅
# (Settings → General → 레포 → Worktree hooks)과 달리 이 파일은 커밋되어
# 팀 전체에 공유된다.
#
# 인식되는 최상위 키는 넷뿐이다: scripts · issueCommand · defaultTabs · environmentRecipes
#   ※ YAML 파싱 에러가 나면 Orca 는 훅을 "부분 적용"하지 않고 통째로 무시한다.
#      수정 후에는 `scripts:` 하위 들여쓰기를 반드시 확인할 것.
#
# 실행 셸  : Linux/macOS = /bin/bash · Windows = %ComSpec%(cmd.exe)
#            → 아래 스크립트는 bash 전용이다. Windows 에서 워크트리를 만드는
#              구성원이 생기면 cmd 분기를 따로 넣어야 한다.
# 타임아웃 : 120 초. 이 저장소는 빌드가 없어 여유가 크다(실측 1초 미만).
# 작업경로 : $ORCA_WORKTREE_PATH 에서 단일 셸 스크립트로 한 번에 실행된다.
#
# 제공 환경변수
#   $ORCA_ROOT_PATH       메인 레포 체크아웃 경로 (비추적 자산의 출처)
#   $ORCA_WORKTREE_PATH   지금 생성 중인 워크트리 경로
#   $ORCA_WORKSPACE_NAME  워크스페이스 이름 (보통 브랜치명)
#
# 실제 로직은 tools/orca-setup.sh 에 있다 — 직접 실행해 검증할 수 있도록 분리했다.
# 그 파일은 반드시 git 에 추적되어야 한다(미추적이면 새 워크트리에 존재하지 않아
# 훅이 매번 실패한다).
#
# archive 훅은 두지 않았다. 이 setup 은 심볼릭 링크를 만들지 않고 1MB 미만을
# 복사할 뿐이라 워크트리 삭제 시 정리할 공유 자원이 없다.
#
# 최초 실행 시 Orca 가 "이 저장소의 orca.yaml 훅을 실행할까요?" 신뢰 확인을 띄운다.
# → "Always trust" 를 선택하면 이후 워크트리부터 자동 실행된다.
# ===================================================================

scripts:
  setup: |
    set -u
    bash tools/orca-setup.sh
